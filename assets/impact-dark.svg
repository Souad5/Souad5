<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title">
<title id="title">Impact: ~30% faster UI development, ~40% fewer API requests, 3 product modules, 0 critical production bugs</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tile{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs>
<g class="tile" style="animation-delay:0.00s">
<rect x="0.5" y="0.5" width="291" height="131" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="24" y="60" class="sans" font-size="44" font-weight="700" letter-spacing="-1" fill="url(#num)">~30%</text>
<text x="24" y="90" class="sans" font-size="18" font-weight="600" fill="#e6edf3">faster UI development</text>
<text x="24" y="113" class="sans" font-size="15" fill="#8b949e">10+ reusable React components</text>
<rect class="bar" style="animation-delay:0.35s" x="24" y="129" width="244" height="3" rx="1.5" fill="#22d3ee"/>
</g><g class="tile" style="animation-delay:0.12s">
<rect x="308.5" y="0.5" width="291" height="131" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="332" y="60" class="sans" font-size="44" font-weight="700" letter-spacing="-1" fill="url(#num)">~40%</text>
<text x="332" y="90" class="sans" font-size="18" font-weight="600" fill="#e6edf3">fewer API requests</text>
<text x="332" y="113" class="sans" font-size="15" fill="#8b949e">15+ endpoints on React Query</text>
<rect class="bar" style="animation-delay:0.47s" x="332" y="129" width="244" height="3" rx="1.5" fill="#22d3ee"/>
</g><g class="tile" style="animation-delay:0.24s">
<rect x="0.5" y="148.5" width="291" height="131" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="24" y="208" class="sans" font-size="44" font-weight="700" letter-spacing="-1" fill="url(#num)">3</text>
<text x="24" y="238" class="sans" font-size="18" font-weight="600" fill="#e6edf3">product modules</text>
<text x="24" y="261" class="sans" font-size="15" fill="#8b949e">built on the shared components</text>
<rect class="bar" style="animation-delay:0.59s" x="24" y="277" width="244" height="3" rx="1.5" fill="#22d3ee"/>
</g><g class="tile" style="animation-delay:0.36s">
<rect x="308.5" y="148.5" width="291" height="131" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="332" y="208" class="sans" font-size="44" font-weight="700" letter-spacing="-1" fill="url(#num)">0</text>
<text x="332" y="238" class="sans" font-size="18" font-weight="600" fill="#e6edf3">critical production bugs</text>
<text x="332" y="261" class="sans" font-size="15" fill="#8b949e">every sprint delivered on time</text>
<rect class="bar" style="animation-delay:0.71s" x="332" y="277" width="244" height="3" rx="1.5" fill="#22d3ee"/>
</g>
</svg>
